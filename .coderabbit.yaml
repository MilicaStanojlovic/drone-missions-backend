# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  auto_review:
    # Off on purpose — no automatic PR reviews. Deleting this file would NOT
    # disable them; auto_review defaults to true. Ask for one with
    # "@coderabbitai review" on a PR when you actually want it.
    enabled: false
    base_branches:
      - "develop"