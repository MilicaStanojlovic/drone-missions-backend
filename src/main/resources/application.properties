server.port=8085
spring.application.name=drone-missions
spring.datasource.url=jdbc:postgresql://localhost:5432/drone-missions
spring.datasource.username=postgres
spring.datasource.password=postgres

# Schema is owned by Flyway migrations (src/main/resources/db/migration).
# Hibernate only validates that entities match the migrated schema; it never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway. baseline-on-migrate lets Flyway adopt an existing (pre-Flyway) database:
# it stamps the current schema as the V1 baseline instead of re-running V1.
spring.flyway.baseline-on-migrate=false

# JWT. The secret must be at least 32 bytes for HS256.
# override it (and the expiry) in production via the SECURITY_JWT_SECRET env var.
security.jwt.secret=${SECURITY_JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:86400000}

# Email (Gmail SMTP). Supply real credentials via env vars — a Gmail App Password, NOT the
# account password. Leave app.mail.enabled=false (default) to run without sending: EmailService
# then logs the rendered HTML instead of dispatching it, so the app works with no credentials.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:DroneMissions <no-reply@dronemissions.app>}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}