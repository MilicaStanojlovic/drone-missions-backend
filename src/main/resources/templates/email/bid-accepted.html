<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Your bid was accepted</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fa;font-family:'Space Grotesk','Segoe UI',Arial,sans-serif;color:#1b2732;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fa;padding:28px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e8edf2;border-radius:14px;overflow:hidden;">
        <tr><td style="background:#141e28;padding:20px 28px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:0.14em;color:#ffffff;">&#9672; DRONEMISSIONS</span>
        </td></tr>
        <tr><td style="height:4px;background:#12a06a;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="padding:30px 28px 6px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#12a06a;">Bid accepted</div>
          <h1 style="margin:8px 0 6px;font-size:22px;font-weight:700;color:#141e28;">Your bid was accepted &#127881;</h1>
          <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#43525f;">
            Hi <strong th:text="${recipientName}">pilot</strong>, your bid on
            <strong th:text="${missionName}">Mission</strong> was accepted &mdash; the mission is yours.
          </p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef8f2;border:1px solid #cbe9d8;border-radius:10px;margin-bottom:22px;">
            <tr>
              <td style="padding:14px 16px;">
                <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:#7aa890;">Your winning bid</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#12704b;margin-top:2px;">$<span th:text="${amount}">0</span></div>
              </td>
            </tr>
          </table>
          <a th:href="${ctaUrl}" style="display:inline-block;background:#12a06a;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:9px;">View the mission &rarr;</a>
        </td></tr>
        <tr><td style="padding:24px 28px;">
          <p style="margin:0;font-size:12px;line-height:1.5;color:#93a1b0;">DroneMissions &mdash; the drone mission marketplace. When the mission's start date arrives you'll be able to mark it finished from its page.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
