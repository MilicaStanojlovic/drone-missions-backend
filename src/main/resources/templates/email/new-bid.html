<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>New bid on your mission</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fa;font-family:'Space Grotesk','Segoe UI',Arial,sans-serif;color:#1b2732;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fa;padding:28px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e8edf2;border-radius:14px;overflow:hidden;">
        <tr><td style="background:#141e28;padding:20px 28px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:0.14em;color:#ffffff;">&#9672; DRONEMISSIONS</span>
        </td></tr>
        <tr><td style="height:4px;background:#2f6bff;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="padding:30px 28px 6px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#2f6bff;">New bid</div>
          <h1 style="margin:8px 0 6px;font-size:22px;font-weight:700;color:#141e28;">You have a new bid</h1>
          <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#43525f;">
            Hi <strong th:text="${recipientName}">designer</strong>,
            <strong th:text="${pilotName}">a pilot</strong> placed a bid on your mission
            <strong th:text="${missionName}">Mission</strong>.
          </p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9fb;border:1px solid #e8edf2;border-radius:10px;margin-bottom:22px;">
            <tr>
              <td style="padding:14px 16px;">
                <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:#a2afbc;">Bid amount</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#1b2732;margin-top:2px;">$<span th:text="${amount}">0</span></div>
                <div th:if="${bidMessage}" style="margin-top:8px;font-size:13px;color:#4a5a6a;font-style:italic;">&ldquo;<span th:text="${bidMessage}">message</span>&rdquo;</div>
              </td>
            </tr>
          </table>
          <a th:href="${ctaUrl}" style="display:inline-block;background:#2f6bff;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:9px;">Review the bid &rarr;</a>
        </td></tr>
        <tr><td style="padding:24px 28px;">
          <p style="margin:0;font-size:12px;line-height:1.5;color:#93a1b0;">DroneMissions &mdash; the drone mission marketplace. You're receiving this because someone bid on a mission you created.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
